AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Scheduled Lambda function that runs every Friday at 8 PM EST to:
  1) Delete unattached EBS volumes
  2) Delete snapshots older than 30 days
  3) Migrate GP2 volumes to GP3

Resources:

  #############################################################################
  # IAM Policy — attach EC2 permissions to the existing Lambda execution role
  #############################################################################
  EBSMaintenancePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EBSMaintenancePolicy
      Roles:
        - customer_lambda_basic_execution_role
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ec2:DescribeVolumes
              - ec2:DeleteVolume
              - ec2:DescribeSnapshots
              - ec2:DeleteSnapshot
              - ec2:ModifyVolume
            Resource: "*"

  #############################################################################
  # Lambda Function
  #############################################################################
  EBSMaintenanceLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: ebs-maintenance-cleanup
      Description: >
        Deletes unattached EBS volumes, removes snapshots older than 30 days,
        and migrates GP2 volumes to GP3.
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      MemorySize: 256
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/customer_lambda_basic_execution_role"
      Environment:
        Variables:
          REGION: us-east-1
      Code:
        ZipFile: |
          import boto3
          import os
          from datetime import datetime, timezone, timedelta

          def handler(event, context):
              region = os.environ.get("REGION", "us-east-1")
              ec2 = boto3.client("ec2", region_name=region)

              delete_unattached_volumes(ec2)
              delete_old_snapshots(ec2)
              migrate_gp2_to_gp3(ec2)

              return {"statusCode": 200, "body": "EBS maintenance completed"}


          def delete_unattached_volumes(ec2):
              """Delete all EBS volumes that are not attached to any instance."""
              print("--- Deleting unattached volumes ---")
              paginator = ec2.get_paginator("describe_volumes")
              for page in paginator.paginate(
                  Filters=[{"Name": "status", "Values": ["available"]}]
              ):
                  for volume in page["Volumes"]:
                      vol_id = volume["VolumeId"]
                      try:
                          ec2.delete_volume(VolumeId=vol_id)
                          print(f"Deleted unattached volume: {vol_id}")
                      except Exception as e:
                          print(f"Failed to delete volume {vol_id}: {e}")


          def delete_old_snapshots(ec2):
              """Delete all EBS snapshots owned by this account that are older than 30 days."""
              print("--- Deleting snapshots older than 30 days ---")
              cutoff = datetime.now(timezone.utc) - timedelta(days=30)

              paginator = ec2.get_paginator("describe_snapshots")
              for page in paginator.paginate(OwnerIds=["self"]):
                  for snapshot in page["Snapshots"]:
                      snap_id = snapshot["SnapshotId"]
                      start_time = snapshot["StartTime"]
                      if start_time < cutoff:
                          try:
                              ec2.delete_snapshot(SnapshotId=snap_id)
                              print(f"Deleted old snapshot: {snap_id} (created {start_time})")
                          except Exception as e:
                              print(f"Failed to delete snapshot {snap_id}: {e}")


          def migrate_gp2_to_gp3(ec2):
              """Modify all GP2 volumes to GP3."""
              print("--- Migrating GP2 volumes to GP3 ---")
              paginator = ec2.get_paginator("describe_volumes")
              for page in paginator.paginate(
                  Filters=[{"Name": "volume-type", "Values": ["gp2"]}]
              ):
                  for volume in page["Volumes"]:
                      vol_id = volume["VolumeId"]
                      try:
                          ec2.modify_volume(VolumeId=vol_id, VolumeType="gp3")
                          print(f"Migrated volume {vol_id} from GP2 to GP3")
                      except Exception as e:
                          print(f"Failed to migrate volume {vol_id}: {e}")

  #############################################################################
  # EventBridge Rule — every Friday at 8 PM EST (01:00 UTC Saturday)
  #############################################################################
  EBSMaintenanceScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: ebs-maintenance-weekly-schedule
      Description: Triggers EBS maintenance Lambda every Friday at 8 PM EST
      ScheduleExpression: "cron(0 1 ? * SAT *)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt EBSMaintenanceLambda.Arn
          Id: EBSMaintenanceLambdaTarget

  #############################################################################
  # Permission for EventBridge to invoke Lambda
  #############################################################################
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EBSMaintenanceLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EBSMaintenanceScheduleRule.Arn

Outputs:
  LambdaFunctionArn:
    Description: ARN of the EBS maintenance Lambda function
    Value: !GetAtt EBSMaintenanceLambda.Arn
  ScheduleRuleArn:
    Description: ARN of the EventBridge schedule rule
    Value: !GetAtt EBSMaintenanceScheduleRule.Arn
